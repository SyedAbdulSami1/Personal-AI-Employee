[project]
name = "personal-ai-employee-hackathon"
version = "0.1.0"
description = "Personal AI Employee - Digital FTE for Panaversity Hackathon"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client>=2.0.0",
    "google-auth-httplib2>=0.1.0",
    "google-auth-oauthlib>=1.0.0",
    "playwright>=1.40.0",
    "watchdog>=3.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0.0",
    "pytest>=7.0.0",
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
]
