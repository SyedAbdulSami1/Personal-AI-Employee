<!DOCTYPE html>
<html lang="en" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Employee Command Center</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .kanban-column { min-height: 500px; }
        .glass { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(10px); }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-full flex flex-col overflow-hidden">

    <!-- Top Navigation Bar -->
    <nav class="bg-indigo-700 text-white px-6 py-4 flex items-center justify-between shadow-lg z-10">
        <div class="flex items-center space-x-3">
            <div class="bg-white p-2 rounded-lg shadow-sm">
                <i data-lucide="bot" class="text-indigo-700 w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight">Personal AI Employee</h1>
                <p class="text-xs text-indigo-200 uppercase font-semibold">Command Center v0.2</p>
            </div>
        </div>
        
        <div class="flex items-center space-x-6">
            <div class="flex space-x-2">
                <span id="modeBadge" class="px-3 py-1 bg-indigo-600 rounded-full text-xs font-bold border border-indigo-400">LOADING...</span>
                <span id="statusBadge" class="px-3 py-1 bg-green-500 rounded-full text-xs font-bold flex items-center">
                    <span class="w-2 h-2 bg-white rounded-full mr-2 animate-pulse"></span> SYSTEM ONLINE
                </span>
            </div>
            <div class="text-right">
                <p id="currentTime" class="text-sm font-medium">00:00:00 AM</p>
                <p id="currentDate" class="text-xs text-indigo-200">Monday, Jan 1 2026</p>
            </div>
        </div>
    </nav>

    <div class="flex-1 flex overflow-hidden">
        
        <!-- Sidebar Navigation -->
        <aside class="w-64 bg-slate-900 text-slate-400 flex flex-col shadow-2xl">
            <div class="p-6 space-y-8 flex-1">
                <div>
                    <h2 class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-4">Operations</h2>
                    <nav class="space-y-2">
                        <a href="#" class="flex items-center space-x-3 px-3 py-2 bg-indigo-600 text-white rounded-lg transition-all shadow-md">
                            <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                            <span class="font-medium">Task Dashboard</span>
                        </a>
                        <a href="#" class="flex items-center space-x-3 px-3 py-2 hover:bg-slate-800 hover:text-white rounded-lg transition-all group">
                            <i data-lucide="file-text" class="w-5 h-5 group-hover:text-indigo-400"></i>
                            <span>Audit Logs</span>
                        </a>
                        <a href="#" onclick="window.open('/api/logs', '_blank')" class="flex items-center space-x-3 px-3 py-2 hover:bg-slate-800 hover:text-white rounded-lg transition-all group">
                            <i data-lucide="terminal" class="w-5 h-5 group-hover:text-indigo-400"></i>
                            <span>Raw Logs API</span>
                        </a>
                    </nav>
                </div>

                <div>
                    <h2 class="text-xs font-bold uppercase tracking-widest text-slate-500 mb-4">Reports</h2>
                    <nav class="space-y-2">
                        <a href="#" class="flex items-center space-x-3 px-3 py-2 hover:bg-slate-800 hover:text-white rounded-lg transition-all group">
                            <i data-lucide="briefcase" class="w-5 h-5 group-hover:text-indigo-400"></i>
                            <span>CEO Briefings</span>
                        </a>
                        <a href="#" class="flex items-center space-x-3 px-3 py-2 hover:bg-slate-800 hover:text-white rounded-lg transition-all group">
                            <i data-lucide="dollar-sign" class="w-5 h-5 group-hover:text-indigo-400"></i>
                            <span>Accounting</span>
                        </a>
                    </nav>
                </div>
            </div>

            <div class="p-6 border-t border-slate-800 bg-slate-950">
                <button onclick="refreshData()" class="w-full flex items-center justify-center space-x-2 py-3 bg-slate-800 hover:bg-indigo-600 text-white rounded-xl transition-all font-semibold">
                    <i data-lucide="refresh-cw" class="w-4 h-4"></i>
                    <span>Force Refresh</span>
                </button>
            </div>
        </aside>

        <!-- Main Content (Kanban) -->
        <main class="flex-1 overflow-x-auto p-8 flex space-x-8 bg-slate-100 scrollbar-hide">
            
            <!-- Needs Action Column -->
            <div class="flex-shrink-0 w-96 flex flex-col h-full">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center space-x-2">
                        <span class="p-1.5 bg-blue-100 text-blue-600 rounded-md">
                            <i data-lucide="inbox" class="w-5 h-5"></i>
                        </span>
                        <h2 class="font-bold text-slate-700 uppercase tracking-wide">Inbox</h2>
                        <span id="countInbox" class="bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
                    </div>
                </div>
                <div id="colInbox" class="kanban-column space-y-4 overflow-y-auto pr-2 scrollbar-hide">
                    <!-- Cards injected here -->
                </div>
            </div>

            <!-- Pending Approval Column -->
            <div class="flex-shrink-0 w-96 flex flex-col h-full">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center space-x-2">
                        <span class="p-1.5 bg-amber-100 text-amber-600 rounded-md">
                            <i data-lucide="clipboard-check" class="w-5 h-5"></i>
                        </span>
                        <h2 class="font-bold text-slate-700 uppercase tracking-wide">Pending Approval</h2>
                        <span id="countPending" class="bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
                    </div>
                </div>
                <div id="colPending" class="kanban-column space-y-4 overflow-y-auto pr-2 scrollbar-hide">
                    <!-- Cards injected here -->
                </div>
            </div>

            <!-- Done Column -->
            <div class="flex-shrink-0 w-96 flex flex-col h-full">
                <div class="flex items-center justify-between mb-4">
                    <div class="flex items-center space-x-2">
                        <span class="p-1.5 bg-emerald-100 text-emerald-600 rounded-md">
                            <i data-lucide="check-circle" class="w-5 h-5"></i>
                        </span>
                        <h2 class="font-bold text-slate-700 uppercase tracking-wide">Archive (Done)</h2>
                        <span id="countDone" class="bg-slate-200 text-slate-600 px-2 py-0.5 rounded-full text-xs font-bold">0</span>
                    </div>
                </div>
                <div id="colDone" class="kanban-column space-y-4 overflow-y-auto pr-2 scrollbar-hide opacity-80">
                    <!-- Cards injected here -->
                </div>
            </div>

        </main>
    </div>

    <!-- Notification Overlay (Bottom Right) -->
    <div id="notifications" class="fixed bottom-6 right-6 z-50 space-y-3 pointer-events-none"></div>

    <script>
        // Init Icons
        lucide.createIcons();

        // Constants
        const API_BASE = "http://localhost:8000/api";

        // Time/Date Updater
        function updateTime() {
            const now = new Date();
            document.getElementById('currentTime').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('currentDate').textContent = now.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric', year: 'numeric' });
        }
        setInterval(updateTime, 1000);
        updateTime();

        async function fetchStatus() {
            try {
                const res = await fetch(`${API_BASE}/status`);
                const data = await res.json();
                document.getElementById('modeBadge').textContent = data.mode;
                document.getElementById('modeBadge').className = `px-3 py-1 rounded-full text-xs font-bold border ${data.mode === 'DRY_RUN' ? 'bg-amber-600 border-amber-400' : 'bg-rose-600 border-rose-400'}`;
            } catch (err) {
                console.error("Status fetch failed", err);
            }
        }

        async function moveTask(filename, fromFolder, toFolder) {
            try {
                const res = await fetch(`${API_BASE}/tasks/move`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename, from: fromFolder, to: toFolder })
                });
                const result = await res.json();
                if (result.status === 'success') {
                    showNotification(`Moved to ${toFolder} successfully`, 'success');
                    refreshData();
                } else {
                    showNotification(result.detail || 'Move failed', 'error');
                }
            } catch (err) {
                showNotification(err.message, 'error');
            }
        }

        function createCard(task, folderName) {
            const type = task.metadata?.type || 'file';
            const priority = task.metadata?.priority || 'medium';
            const mtime = new Date(task.mtime).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
            
            const colorMap = {
                email: 'blue',
                whatsapp: 'green',
                file_drop: 'amber',
                default: 'slate'
            };
            const color = colorMap[type] || colorMap.default;

            const priorityMap = {
                high: 'text-rose-600 bg-rose-50 border-rose-100',
                medium: 'text-amber-600 bg-amber-50 border-amber-100',
                low: 'text-slate-500 bg-slate-50 border-slate-100'
            };

            let actions = '';
            if (folderName === 'Pending_Approval') {
                actions = `
                    <div class="mt-4 flex space-x-2 pt-4 border-t border-slate-100">
                        <button onclick="moveTask('${task.filename}', 'Pending_Approval', 'Approved')" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white py-2 rounded-lg text-sm font-bold shadow-sm transition-all">APPROVE</button>
                        <button onclick="moveTask('${task.filename}', 'Pending_Approval', 'Rejected')" class="flex-1 bg-slate-200 hover:bg-rose-600 hover:text-white text-slate-700 py-2 rounded-lg text-sm font-bold transition-all">REJECT</button>
                    </div>
                `;
            }

            return `
                <div class="bg-white p-5 rounded-2xl shadow-sm border-l-4 border-${color}-500 hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1">
                    <div class="flex justify-between items-start mb-3">
                        <span class="text-[10px] font-black uppercase tracking-widest px-2 py-0.5 rounded border ${priorityMap[priority]}">${priority}</span>
                        <span class="text-[10px] text-slate-400 font-bold uppercase">${mtime}</span>
                    </div>
                    <h3 class="font-bold text-slate-800 leading-tight mb-2 truncate" title="${task.filename}">${task.metadata?.subject || task.filename}</h3>
                    <p class="text-xs text-slate-500 line-clamp-3 mb-4 leading-relaxed">${task.preview}</p>
                    <div class="flex items-center justify-between text-[10px] font-bold text-slate-400">
                        <span class="flex items-center"><i data-lucide="${type === 'email' ? 'mail' : (type === 'whatsapp' ? 'message-circle' : 'file')}" class="w-3 h-3 mr-1 text-${color}-500"></i> ${type.toUpperCase()}</span>
                        <span>FROM: ${task.metadata?.from || 'Unknown'}</span>
                    </div>
                    ${actions}
                </div>
            `;
        }

        async function fetchColumn(folder, containerId, countId) {
            try {
                const res = await fetch(`${API_BASE}/tasks/${folder}`);
                const tasks = await res.json();
                const container = document.getElementById(containerId);
                const count = document.getElementById(countId);
                
                count.textContent = tasks.length;
                container.innerHTML = tasks.length > 0 
                    ? tasks.map(t => createCard(t, folder)).join('') 
                    : '<div class="text-center py-12 text-slate-400 italic text-sm border-2 border-dashed border-slate-200 rounded-2xl">No tasks here</div>';
                
                lucide.createIcons();
            } catch (err) {
                console.error(`Fetch ${folder} failed`, err);
            }
        }

        function showNotification(msg, type) {
            const container = document.getElementById('notifications');
            const toast = document.createElement('div');
            const colorClass = type === 'success' ? 'bg-emerald-600 text-white' : 'bg-rose-600 text-white';
            toast.className = `${colorClass} px-6 py-4 rounded-2xl shadow-2xl flex items-center space-x-3 transition-all duration-500 opacity-0 transform translate-y-4 pointer-events-auto cursor-pointer`;
            toast.innerHTML = `
                <i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}" class="w-5 h-5"></i>
                <span class="font-bold text-sm uppercase">${msg}</span>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            
            setTimeout(() => { toast.classList.remove('opacity-0', 'translate-y-4'); }, 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                setTimeout(() => toast.remove(), 500);
            }, 4000);
        }

        function refreshData() {
            fetchStatus();
            fetchColumn('Needs_Action', 'colInbox', 'countInbox');
            fetchColumn('Pending_Approval', 'colPending', 'countPending');
            fetchColumn('Done', 'colDone', 'countDone');
        }

        // Auto Refresh every 15 seconds
        setInterval(refreshData, 15000);
        refreshData();

    </script>
</body>
</html>
